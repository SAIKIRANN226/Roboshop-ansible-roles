# Why we commented above code ? Because ansible is getting package from the s3 bucket right ? But we want now to get from the Nexus repository, since we stored artifacts in the nexus

- name: "download artifact from nexus"
  ansible.builtin.get_url:
    url: "{{NEXUS_URL}}/{{component}}/{{group_id}}/{{app_version}}/{{component}}-{{app_version}}.zip" # We mentioned all these variable files
    dest: /tmp

- name: "extract catalogue application"
  ansible.builtin.unarchive:
    src: "/tmp/{{component}}--{{app_version}}.zip"
    dest: /app
    remote_src: yes
